<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#FFFFFF">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="할 일 · 루틴 · 공부 시간 · 프로젝트 관리">
  <title>하루</title>
  <script>
    // 저장된 테마를 화면이 그려지기 전에 적용 (깜빡임 방지). 기본값은 밝게.
    try {
      var t = localStorage.getItem('haru:theme') || 'light';
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) {
      document.documentElement.dataset.theme = 'light';
    }
  </script>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/components.css">
  <script type="module" src="./js/app.js"></script>
</head>
<body>
  <div id="app">
    <nav id="nav" class="nav" aria-label="주요 메뉴"></nav>
    <main id="main" class="main" tabindex="-1"></main>
  </div>
  <div id="sheet-root"></div>
  <div id="toast-root" aria-live="polite"></div>
  <noscript>이 앱은 JavaScript가 필요해요.</noscript>
</body>
</html>
